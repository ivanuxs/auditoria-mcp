# Puerta pública del MCP de auditoría.
#
# Destino: oficina-2 (192.168.1.100), igual que los demás servicios `mcp/`:
#   1) Crear el registro DNS auditoria.hlquantlabs.trade en Cloudflare
#   2) Copiar a /etc/nginx/sites-available/
#   3) Enlazar en /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) sudo certbot --nginx -d auditoria.hlquantlabs.trade --redirect
#      (el bloque 443 y la redirección de abajo los generó certbot; ya están aquí)
#
# El destino interno es el proxy de esta misma máquina; el token lo exige
# proxy.py, no nginx.

server {
    server_name auditoria.hlquantlabs.trade;

    location / {
        proxy_pass http://127.0.0.1:8941;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP (Streamable HTTP) responde con SSE y mantiene la conexión abierta:
        # sin búfer y con tiempos largos, o las sesiones se cortan solas.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/auditoria.hlquantlabs.trade/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/auditoria.hlquantlabs.trade/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = auditoria.hlquantlabs.trade) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name auditoria.hlquantlabs.trade;
    return 404; # managed by Certbot

}
