# Puerta pública del MCP de auditoría.
#
# Destino: oficina-2 (192.168.1.100), igual que los demás servicios `mcp/`:
#   1) Crear el registro DNS auditoria.hlquantlabs.trade en Cloudflare
#   2) Copiar a /etc/nginx/sites-available/
#   3) Enlazar en /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) sudo certbot --nginx -d auditoria.hlquantlabs.trade --redirect
#      (certbot añade el bloque SSL 443 y la redirección desde 80)
#
# El destino interno es el proxy de esta misma máquina; el token lo exige
# proxy.py, no nginx.

server {
    listen 80;
    listen [::]:80;
    server_name auditoria.hlquantlabs.trade;

    location / {
        proxy_pass http://127.0.0.1:8941;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP (Streamable HTTP) responde con SSE y mantiene la conexión abierta:
        # sin búfer y con tiempos largos, o las sesiones se cortan solas.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
